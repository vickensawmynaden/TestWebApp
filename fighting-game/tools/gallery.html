<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fighter Pose Gallery</title>
  <!-- Dev tool: every fighter in one pose, side by side.
       ?pose=stance | <STATE_POSES key> | <ATTACKS key>.wind / .hit   ?model=skinned|procedural   ?yaw=deg -->
  <script type="importmap">{ "imports": { "three": "../vendor/three/three.module.min.js", "three/addons/": "../vendor/three/addons/" } }</script>
  <style>body { margin: 0; background: #1b1d22; } canvas { display: block; } #lbl { position: fixed; left: 8px; top: 6px; color: #fff; font: 13px monospace; }</style>
</head>
<body>
<div id="lbl"></div>
<script type="module">
import * as THREE from 'three';
import { STANCES, STATE_POSES, ATTACKS, compilePose } from '../js/render/poses.js';
import { FighterModel } from '../js/render/FighterModel.js';
import { SkinnedFighter, preloadCharacters, hasSkinned } from '../js/render/SkinnedFighter.js';
import { CHARACTERS } from '../js/sim/characters.js';

const q = new URLSearchParams(location.search);
const ids = (q.get('ids') || 'ren,maya,viktor,leila,caio,sora').split(',');
const poseName = q.get('pose') || 'stance';
const useSkinned = (q.get('model') || 'skinned') === 'skinned';
const yaw = (+q.get('yaw') || 0) * Math.PI / 180;
const W = +q.get('w') || 1500, H = +q.get('h') || 560;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2d34);
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x3a3020, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(2, 5, 4); sun.castShadow = true;
sun.shadow.camera.left = -6; sun.shadow.camera.right = 6; sun.shadow.camera.top = 3; sun.shadow.camera.bottom = -1;
scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 10), new THREE.MeshStandardMaterial({ color: 0x55585f, roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const grid = new THREE.GridHelper(30, 60, 0x777777, 0x666666); grid.position.y = 0.001; scene.add(grid);

if (useSkinned) await preloadCharacters(ids, null, '../assets/characters/');

function poseFor(id) {
  const stance = compilePose(STANCES[id] || STANCES.kai);
  if (poseName === 'stance') return stance;
  const [k, phase] = poseName.split('.');
  if (STATE_POSES[k]) return compilePose(STATE_POSES[k], stance);
  if (ATTACKS[k]) return compilePose(ATTACKS[k][phase || 'hit'], stance);
  throw new Error('unknown pose ' + poseName);
}

const models = [];
ids.forEach((id, i) => {
  const def = CHARACTERS[id];
  const m = useSkinned && hasSkinned(id) ? new SkinnedFighter(id, def) : new FighterModel(id, def);
  m.root.position.set((i - (ids.length - 1) / 2) * 1.35, 0, 0);
  m.root.rotation.y = yaw;
  scene.add(m.root);
  m.root.updateMatrixWorld(true);
  m.applyPose(poseFor(id));
  if (q.get('weights') && m.mesh) {
    // Debug: colour vertices by bone influence (golden-angle hue per bone).
    const g = m.mesh.geometry, si = g.attributes.skinIndex, sw = g.attributes.skinWeight;
    const col = new Float32Array(si.count * 3), c = new THREE.Color();
    for (let v = 0; v < si.count; v++) {
      let r = 0, gg = 0, bb = 0;
      for (let k = 0; k < 4; k++) {
        const w = sw.getComponent(v, k); if (!w) continue;
        c.setHSL((si.getComponent(v, k) * 0.618) % 1, 0.85, 0.5);
        r += c.r * w; gg += c.g * w; bb += c.b * w;
      }
      col.set([r, gg, bb], v * 3);
    }
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    m.mesh.material = new THREE.MeshLambertMaterial({ vertexColors: true });
  }
  models.push(m);
});
if (q.get('portraits')) {
  // Select-screen portrait sheet: 3 x 2 cells of 512 px, upper body in a three-quarter view.
  scene.background = new THREE.Color(0x15171c);
  floor.visible = false; grid.visible = false;
  renderer.setSize(1536, 1024);
  renderer.setScissorTest(true);
  const rim = new THREE.DirectionalLight(0x9fc4ff, 1.6); rim.position.set(-3, 3, -4); scene.add(rim);
  models.forEach((m, i) => {
    models.forEach((o) => { o.root.visible = o === m; });
    m.root.rotation.y = 0.45; m.root.updateMatrixWorld(true); m.applyPose(poseFor(ids[i]));
    m.root.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(m.root, true);
    const top = box.max.y, x = m.root.position.x;
    const cam = new THREE.PerspectiveCamera(24, 1, 0.1, 100);
    const h = top * 0.62;
    cam.position.set(x + 0.35, top - h * 0.45, h / Math.tan(12 * Math.PI / 180) * 0.62);
    cam.lookAt(x, top - h * 0.5, 0);
    const col = i % 3, row = Math.floor(i / 3);
    renderer.setViewport(col * 512, (1 - row) * 512, 512, 512); renderer.setScissor(col * 512, (1 - row) * 512, 512, 512);
    renderer.render(scene, cam);
  });
} else {
// One viewport per fighter.
renderer.setScissorTest(true);
const vw = W / ids.length;
models.forEach((m, i) => {
  const x = m.root.position.x;
  const cam = new THREE.PerspectiveCamera(30, vw / H, 0.1, 100);
  cam.position.set(x + Math.sin(yaw) * 0, 1.0, +q.get('dist') || 5.2);
  cam.lookAt(x, 0.92, 0);
  renderer.setViewport(i * vw, 0, vw, H); renderer.setScissor(i * vw, 0, vw, H);
  renderer.render(scene, cam);
});
}
if (!q.get('portraits')) document.getElementById('lbl').textContent = `${poseName}  (${useSkinned ? 'skinned glTF' : 'procedural'})  ` + ids.join(' · ');
window.__models = models; window.__done = true;
</script>
</body>
</html>
